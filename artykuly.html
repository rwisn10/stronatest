<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artykuły — Mateusz Talar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"></head><body><div id="nav"></div><header class="page-head"><div class="wrap"><span class="pill">Baza wiedzy</span><h1>Artykuły</h1><p>Wyjaśniamy, co proponujemy i dlaczego — w każdej dziedzinie programu.</p></div></header>
<section><div class="wrap"><input id="q" placeholder="Szukaj w artykułach…" style="max-width:380px"><div class="filters" id="cats"></div><p id="count" style="color:var(--dim);margin:-14px 0 24px"></p><div class="grid g3" id="list"></div><div class="filters" id="pager" style="justify-content:center;margin-top:40px"></div></div></section><div id="foot"></div><script src="script.js"></script><script src="articles-data.js"></script><script>
const MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function dateOf(i){const d=new Date(2026,9,4);d.setDate(d.getDate()-Math.floor(i*1.7));return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function mins(a){return Math.max(1,Math.round((a.l+' '+a.b).split(' ').length/180))}
</script><script>
let cat='all',page=1,q='';const PER=12,cats=['all',...new Set(ARTICLES.map(a=>a.c))];
const $=id=>document.getElementById(id);
function draw(){const f=ARTICLES.filter(a=>(cat==='all'||a.c===cat)&&(a.t+a.l).toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(f.length/PER));page=Math.min(page,pages);
$('count').textContent=f.length+' artykułów';
$('list').innerHTML=f.slice((page-1)*PER,page*PER).map(a=>`<a href="artykul.html?id=${a.id}" class="card"><span class="tag">${a.c}</span><h3>${a.t}</h3><p>${a.l}</p><p style="font-size:.8rem;margin-top:10px">${dateOf(a.id)} · ${mins(a)} min czytania</p></a>`).join('')||'<p>Brak wyników.</p>';
$('pager').innerHTML=pages>1?Array.from({length:pages},(_,i)=>`<button class="${i+1===page?'on':''}" data-p="${i+1}">${i+1}</button>`).join(''):'';
$('pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.p;draw();scrollTo({top:300,behavior:'smooth'})})}
$('cats').innerHTML=cats.map(c=>`<button data-c="${c}" class="${c==='all'?'on':''}">${c==='all'?'Wszystkie':c+' ('+ARTICLES.filter(a=>a.c===c).length+')'}</button>`).join('');
$('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('cats').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.c;page=1;draw()});
$('q').oninput=e=>{q=e.target.value.toLowerCase();page=1;draw()};
const pc=new URLSearchParams(location.search).get('c');if(pc){const b=[...$('cats').children].find(x=>x.dataset.c===pc);b&&b.click()}
draw();</script></body></html>
